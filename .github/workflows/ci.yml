name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude kxprovd --exclude kxprov-gw --locked
      - run: cargo test -p kxprovd --features test-util --locked
      - run: cargo test -p kxprov-gw --features test-secret-skip --locked
      - name: A4 local stack smoke (debug sim build)
        run: bash scripts/run-a4.sh smoke
      - name: H5 tool absent from default workspace build
        run: |
          ! cargo build --locked -p kxprov-h5 2>/dev/null
          cargo build --locked -p kxprov-h5 --features h5-test-tool
  release-sim-fault-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p kxprovd -p kxprov-gw
      - name: Sim fault trigger markers absent from release binaries
        run: |
          set -euo pipefail
          markers=(sim_trigger_busy SimTriggerGoliathCopyFail trigger_next_copy_fail sim_trigger_goliath)
          for bin in target/release/kxprovd target/release/kxprov-gw; do
            for m in "${markers[@]}"; do
              if strings "$bin" | grep -q "$m"; then
                echo "release binary $bin must not contain sim-fault marker: $m" >&2
                exit 1
              fi
            done
          done
  build-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add aarch64-unknown-linux-gnu
      - run: pip install cargo-zigbuild ziglang
      - run: cargo zigbuild --release --locked --target aarch64-unknown-linux-gnu.2.36 -p kxprov -p kxprov-gw
      - name: Binary sizes vs 15 MB budget
        run: |
          budget=$((15*1024*1024)); fail=0
          echo "| binary | bytes | MiB | budget 15 MiB |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for b in target/aarch64-unknown-linux-gnu/release/kxprov target/aarch64-unknown-linux-gnu/release/kxprov-gw; do
            s=$(stat -c %s "$b"); ok=ok; [ "$s" -gt "$budget" ] && ok=OVER && fail=1
            line="| $(basename $b) | $s | $(awk "BEGIN{printf \"%.2f\", $s/1048576}") | $ok |"
            echo "$line"; echo "$line" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $fail
      - uses: actions/upload-artifact@v4
        with:
          name: kxprov-aarch64
          path: target/aarch64-unknown-linux-gnu/release/kxprov
