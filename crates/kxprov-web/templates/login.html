<!DOCTYPE html>
<html lang="en">
<head>
  <title>kx-provision login</title>
  {% include "_head.html" %}
</head>
<body>
  {% include "_header.html" %}
  <main>
    <h1>{{ page_title }}</h1>
    {% if show_error %}<p id="login-error" class="inline-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <label>Password <input type="password" name="password" autocomplete="current-password"{% if show_error %} autofocus aria-invalid="true" aria-describedby="login-error"{% endif %}></label>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
