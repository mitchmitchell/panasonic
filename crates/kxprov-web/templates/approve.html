<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Approve plan — kx-provision</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
  <img src="/static/logo.svg" alt="kx-provision" width="120" height="32">
  <h1>Approve plan</h1>
  <p>Plan <code>{{ plan_id_hex }}</code></p>
  <p>Diff hash: <code>{{ diff_hash_hex }}</code></p>
  <p>{{ plan_summary }}</p>
  {% if show_requested_by %}
  <p>Requested by: {{ requested_by_agent }} (token {{ requested_by_token }})</p>
  {% endif %}
  <form method="post" action="/approve-plan">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <input type="hidden" name="plan_id" value="{{ plan_id_hex }}">
    <input type="hidden" name="diff_hash" value="{{ diff_hash_hex }}">
    <label>Re-auth password <input type="password" name="password" autocomplete="current-password"></label>
    <button type="submit">Mint approval (10 min, single-use)</button>
  </form>
</body>
</html>
