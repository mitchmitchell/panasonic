[package]
name = "kxprov-gw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kxprov-gw"
path = "src/main.rs"

[[test]]
name = "startup"
path = "tests/startup.rs"
required-features = ["test-secret-skip"]

[features]
test-secret-skip = []

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
argon2 = { workspace = true, features = ["password-hash"] }
axum.workspace = true
axum-server.workspace = true
axum_csrf = { workspace = true, features = ["layer"] }
base64.workspace = true
hex.workspace = true
http.workspace = true
kxprov-api.workspace = true
kxprov-mock.workspace = true
kxtd1232.workspace = true
kxprov-mcp = { workspace = true }
rmcp = { workspace = true }
tower-service = "0.3"
kxprov-web = { workspace = true }
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
subtle.workspace = true
time.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["set-header"] }
tower-sessions.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml = "0.8"

[dev-dependencies]
kxprovd = { path = "../kxprovd", features = ["test-util"] }
argon2 = { workspace = true, features = ["password-hash"] }
hyper.workspace = true
rand = "0.8"
http-body-util.workspace = true
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
serde_json.workspace = true
tempfile = "3"
libc = "0.2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid.workspace = true
