[package]
name = "kxprov-api"
description = "Shared request/response types and Unix-socket client for kxprovd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
links = "kxprov_api"
build = "build.rs"

[lints]
workspace = true

[features]
sim-fault-triggers = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "rt", "sync"] }

[dev-dependencies]
kxprov = { path = "../kxprov" }
kxprov-gw = { path = "../kxprov-gw" }
kxprovd = { path = "../kxprovd" }

[[test]]
name = "default_paths_agree"
path = "tests/default_paths_agree.rs"
