[package]
name = "kxprovd-sys"
description = "Safe tty helpers whose implementations use kernel ioctls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["termios", "std"] }
