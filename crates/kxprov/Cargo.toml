[package]
name = "kxprov"
description = "kx-provision CLI (A1: simulator only; version, read, plan)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
kxtd1232 = { path = "../kxtd1232" }
kxtd1232-sim = { path = "../kxtd1232-sim", default-features = false }
kxprov-api = { path = "../kxprov-api" }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde_json = "1"
getrandom = "0.3"
hex = "0.4"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
tempfile = "3"
