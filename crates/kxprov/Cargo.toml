[package]
name = "kxprov"
description = "kx-provision CLI (A1: simulator only; version, read, plan)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kxtd1232 = { path = "../kxtd1232" }
kxtd1232-sim = { path = "../kxtd1232-sim" }
kxprov-api = { path = "../kxprov-api" }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
tokio = { version = "1", features = ["rt", "macros"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "std"] }
hex = "0.4"
